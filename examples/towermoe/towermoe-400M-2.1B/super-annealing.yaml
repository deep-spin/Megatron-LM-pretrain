launch:
    job_name: "towermoe-400M-2.1B"
    run_dir: ./local/fast_runs/towermoe-400M-2.1B/
    num_nodes: 128
    gpus_per_node: 4
    exclusive: True
network_size:
    num_layers: 24
    hidden_size: 1024
    ffn_hidden_size: 512
    num_attention_heads: 8
    num_query_groups: 2
    max_position_embeddings: 4096
    rotary_base: 500000
    tie_embeddings: True
moe:
    num_experts: 64
    expert_model_parallel_size: 1
    moe_router_topk: 8
    moe_aux_loss_reduce_token_counts: True
logging:
    log_params_norm: True
    log_throughput: True
    log_progress: True
regularization:
    weight_decay: 0.1
training:
    micro_batch_size: 4
    global_batch_size: 4096
learning_rate:
    lr: 3e-5
    min_lr: 0
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_wsd_decay_iters: 6675
    lr_warmup_iters: 0
checkpointing:
    save: ./${launch.run_dir}/super-annealing-checkpoints/
    save_interval: 2500
    load: ${checkpointing.save}
    pretrained_checkpoint: ./${launch.run_dir}/annealing-checkpoints/
    annealing: True
validation:
    eval_interval: 1000
    eval_iters: 10
distributed:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    distributed_optimizer: true
data:
    seq_length: ${network_size.max_position_embeddings}
    data_path:
